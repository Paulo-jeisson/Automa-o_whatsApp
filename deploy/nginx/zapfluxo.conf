upstream zapfluxo_app {
    server unix:/run/zapfluxo/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name exemplo.com.br;
    client_max_body_size 10M;

    location /static/ {
        alias /opt/zapfluxo/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/zapfluxo/media/;
        access_log off;
        expires 1d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://zapfluxo_app;
        proxy_read_timeout 60s;
    }
}
