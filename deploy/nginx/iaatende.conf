upstream iaatende_app {
    server unix:/run/iaatende/gunicorn.sock fail_timeout=0;
}

# O certificado da origem deve cobrir iaatende.app e www.iaatende.app.
# Use Cloudflare Origin CA ou certificado público válido; SSL/TLS no painel: Full (strict).
server {
    listen 80;
    listen [::]:80;
    server_name iaatende.app www.iaatende.app;
    return 301 https://iaatende.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.iaatende.app;

    ssl_certificate /etc/ssl/cloudflare/iaatende.app.pem;
    ssl_certificate_key /etc/ssl/cloudflare/iaatende.app.key;
    return 301 https://iaatende.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iaatende.app;
    client_max_body_size 10M;

    ssl_certificate /etc/ssl/cloudflare/iaatende.app.pem;
    ssl_certificate_key /etc/ssl/cloudflare/iaatende.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /opt/iaatende/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/iaatende/media/;
        access_log off;
        expires 1d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://iaatende_app;
        proxy_read_timeout 60s;
    }
}
